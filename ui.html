async function startUninstall(){if(state.busy||state.tab===2)return;const picked=selectedList();if(!picked.length)return;hideMenus();const apps=picked.filter(a=>a.Protection!=='blocked'),excluded=picked.length-apps.length;if(!apps.length){toast('所选项目是系统关键组件或不可卸载的组件，已阻止卸载');return}const choice=await confirmUninstall(apps,excluded);if(!choice)return;if(apps.length===1)await uninstallOne(apps[0],choice.silent);else await runQueue(apps,choice.silent)}

const queue={items:[],running:false,stop:false,silent:false,fresh:true,batchId:''};
function queueCounts(){const c={total:queue.items.length,done:0,removed:0,retry:0};for(const it of queue.items){if(it.status!=='waiting'&&it.status!=='running')c.done++;if(it.removed)c.removed++;if(RETRYABLE.includes(it.status))c.retry++}return c}

async function processQueue(items,silent){queue.running=true;queue.stop=false;$('queueStop').disabled=false;$('queueStop').textContent='停止队列';setBusy(true,'',false);for(const it of items){it.status='waiting';it.message=''}renderQueue();for(const it of items){if(queue.stop){it.status='canceled';it.message='队列已停止，未执行';continue}it.status='running';it.message='如出现卸载向导或权限确认，请按提示完成';$('queueSkip').disabled=false;renderQueue();try{const r=await rpc('uninstall',{ID:it.app.ID,Silent:silent,Append:!queue.fresh,BatchID:queue.batchId});it.status=r.status;it.message=r.message||'';it.removed=!!r.removed}catch(e){it.status='failed';it.message=e.message}queue.fresh=false;renderQueue()}queue.running=false;setBusy(false,'',false);renderQueue()}

function logMessage(text,error=false){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.className='empty'+(error?' error':'');td.textContent=text;tr.append(td);$('historyRows').replaceChildren(tr);$('historyTable').classList.add('message')}
function updateLogPager(){const pages=Math.max(1,Math.ceil(logState.total/logState.size));$('historyPageInfo').textContent=logState.total?'第 '+logState.page+' / '+pages+' 页 · 共 '+logState.total+' 条':'共 0 条';$('historyPrev').disabled=logState.loading||logState.page<=1;$('historyNext').disabled=logState.loading||logState.page>=pages;$('historyExport').disabled=!logState.all;$('historyClear').disabled=!logState.all}
function renderHistory(items,filtered){if(!items.length){logMessage(filtered?'没有符合条件的记录，可点击重置清除筛选':'暂无操作记录');return}const frag=document.createDocumentFragment();for(const e of items){const tr=document.createElement('tr'),who=[e.target,e.version,e.publisher].filter(Boolean).join(' · ');const cells=[[(e.time||'').replace('T',' ').slice(0,19),'date',''],[ACTION_LABEL[e.action]||e.action||'—','',''],[e.target||'—','',who],[MODE_LABEL[e.mode]||'—','',''],[ELEVATION_LABEL[e.elevation]||'—','',''],[STATUS_LABEL[e.status]||e.status||'—','st-'+e.status,''],[e.message||'—','','']];for(const [text,cls,title] of cells){const td=document.createElement('td');td.textContent=text;td.title=title||text;if(cls)td.className=cls;tr.append(td)}frag.append(tr)}$('historyRows').replaceChildren(frag);$('historyTable').classList.remove('message');$('historyTable').scrollTop=0}
async function loadHistory(){if(logState.loading){logState.again=true;return}logState.loading=true;if(!$('historyRows').children.length)logMessage('正在加载…');updateLogPager();const query=$('historyQuery').value.trim(),status=$('historyStatus').value;try{const r=await rpc('history',{Query:query,Status:status,Page:logState.page,PageSize:logState.size});logState.total=r.total||0;logState.all=r.all_total||0;logState.page=r.page||1;renderHistory(r.items||[],!!(query||status))}catch(e){logState.total=0;logMessage('日志读取失败：'+e.message,true)}finally{logState.loading=false;updateLogPager();if(logState.again){logState.again=false;loadHistory()}}}
function openHistory(){if(state.busy)return;hideMenus();$('historyQuery').value='';$('historyStatus').value='';logState.page=1;$('historyRows').replaceChildren();$('historyDialog').showModal();loadHistory()}
